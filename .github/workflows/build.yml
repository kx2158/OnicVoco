# Builds OnicVoco for Windows on every push and uploads the .exe as an artifact.
name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests (audio analysis)
        run: cargo test --no-default-features

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: OnicVoco-windows
          path: target/release/onicvoco.exe
