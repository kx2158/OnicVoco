# Builds OnicVoco for Windows on every push and uploads the .exe as an artifact.
name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests (audio analysis)
        run: cargo test --no-default-features

      - name: Build release
        shell: pwsh
        run: |
          cargo build --release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Surface the important lines as an annotation so they're readable without the raw log.
            $lines = Select-String -Path build.log -Pattern 'error(\[E\d+\])?:|-->|LNK\d{4}|CMake Error|fatal error|warning: llama|cargo:warning' -Context 0,3 |
              Select-Object -First 25 | ForEach-Object { ($_.Line + "`n" + ($_.Context.PostContext -join "`n")) }
            $msg = ($lines -join "`n----`n") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            if ($msg.Length -gt 60000) { $msg = $msg.Substring(0, 60000) }
            Write-Output "::error title=Build errors::$msg"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: OnicVoco-windows
          path: target/release/onicvoco.exe
