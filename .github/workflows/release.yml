# Builds the Windows installer + portable .exe and attaches them to a draft
# GitHub Release. Run it from the Actions tab: Release > Run workflow.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without the v), e.g. 0.2.0'
        required: true
        default: '0.2.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build app
        run: cargo build --release -p onicvoco

      - name: Build AI coach helper
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: cargo build --release -p onicvoco-coach --target-dir target-coach

      - name: Package portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/onicvoco.exe "dist/OnicVoco-${{ inputs.version }}-portable.exe"
          # AI coach helper + the Visual C++ runtime DLLs it needs (app-local copies).
          Copy-Item target-coach/release/onicvoco-coach.exe dist/onicvoco-coach.exe
          foreach ($dll in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" "dist/coach-$dll"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ inputs.version }}" installer/onicvoco.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: OnicVoco v${{ inputs.version }}
          draft: true
          body: |
            **Windows**
            - `OnicVoco-${{ inputs.version }}-setup.exe` - installer (no admin needed, adds a Start menu shortcut)
            - `OnicVoco-${{ inputs.version }}-portable.exe` - single file, just run it

            Windows may show "Windows protected your PC" because the app isn't code-signed yet. Click **More info > Run anyway**.

            The `onicvoco-coach.exe` and `coach-*.dll` files are the optional AI coach. You don't need to download them yourself: the app fetches them when you press **Download AI coach** in Settings.
          files: |
            dist/OnicVoco-${{ inputs.version }}-setup.exe
            dist/OnicVoco-${{ inputs.version }}-portable.exe
            dist/onicvoco-coach.exe
            dist/coach-vcruntime140.dll
            dist/coach-vcruntime140_1.dll
            dist/coach-msvcp140.dll
