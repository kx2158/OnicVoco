# Builds OnicVoco for Windows, macOS (Apple Silicon + Intel) and Linux and
# attaches the installers to a draft GitHub Release.
# Trigger: push a tag like v0.1.0, or run it manually from the Actions tab.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Run analysis tests
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: OnicVoco v__VERSION__
          releaseBody: |
            **Downloads**
            - Windows: `.msi` or `-setup.exe`
            - macOS Apple Silicon (M1 and newer): `aarch64.dmg`
            - macOS Intel: `x64.dmg`
            - Linux: `.AppImage` (any distro), `.deb` (Ubuntu/Debian) or `.rpm` (Fedora)

            macOS builds are not notarized yet. If macOS says the app is damaged or from an unidentified developer, see the README.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
