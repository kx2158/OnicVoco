[package]
name = "onicvoco"
version = "0.2.0"
description = "Gentle, private voice training"
edition = "2021"
license = "MIT"

[features]
default = ["ai"]
# The optional on-device AI coach (llama.cpp). Build with --no-default-features to leave it out.
ai = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:anyhow"]

[dependencies]
eframe = "=0.29.1"
cpal = "0.15.3"
hound = "3.5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dark-light = "1.1"
ureq = "2"
llama-cpp-2 = { version = "=0.1.159", default-features = false, features = ["common"], optional = true }
encoding_rs = { version = "0.8", optional = true }
anyhow = { version = "1", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
