[workspace]
# coach/ is the optional AI helper, downloaded separately by the app.
members = [".", "coach"]

[package]
name = "onicvoco"
version = "0.4.0"
description = "Gentle, private voice training"
edition = "2021"
license = "MIT"

[dependencies]
eframe = "=0.29.1"
cpal = "0.15.3"
hound = "3.5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dark-light = "1.1"
ureq = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
